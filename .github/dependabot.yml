# Keep the actions this repository uses current. There are no packages to
# watch: the app has no dependencies, which is most of why it has so little
# to secure.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
